name: Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token $RAILWAY_TOKEN
          railway up --service gidboy

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GIDBOY_DEMO: '1'
        run: |
          python -c "
          from main import run_gidboy
          from router import route

          # Test routing
          assert route('research solana')[0] == 'RESEARCH'
          assert route('find grants')[0] == 'OPPORTUNITY'
          assert route('detect signals')[0] == 'SIGNAL'

          # Test execution
          result = run_gidboy('test query', use_memory=False)
          assert 'mode' in result
          assert 'result' in result

          print('All tests passed!')
          "